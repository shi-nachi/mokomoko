<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Animal & Sparkle</title>
    <style>
        :root {
            --gold: #FFD700;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: white;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            pointer-events: none; /* 下のキャンバスに触れるように */
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 1rem; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background: var(--gold);
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #result {
            margin-top: 2rem;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .animal-icon { font-size: 4rem; display: block; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="ui-container">
    <div class="card">
        <h1>運勢の守護動物</h1>
        <p>誕生日を入力して運命を見つけよう</p>
        <input type="date" id="birthday" value="2000-01-01">
        <br>
        <button onclick="revealFortune()">運勢を占う</button>
        <div id="result">
            <span class="animal-icon" id="animal-icon"></span>
            <div id="animal-name" style="font-weight: bold; color: var(--gold);"></div>
            <div id="animal-desc" style="font-size: 0.9rem; margin-top: 0.5rem; color: #ccc;"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    const particles = [];
    const colors = ['#FFD700', '#FFFACD', '#FFFFFF', '#00FFFF', '#FF69B4'];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor(x, y, isExplosion = false) {
            this.x = x;
            this.y = y;
            const speedMult = isExplosion ? 8 : 4;
            this.vx = (Math.random() - 0.5) * speedMult;
            this.vy = (Math.random() - 0.5) * speedMult;
            this.size = Math.random() * 3 + 1;
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.01;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw() {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = this.life;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            const s = this.size * this.life;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - s * 2);
            ctx.lineTo(this.x + s * 2, this.y);
            ctx.lineTo(this.x, this.y + s * 2);
            ctx.lineTo(this.x - s * 2, this.y);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }

    // 動物データ
    const animals = [
        { name: "孤高のライオン", icon: "🦁", desc: "圧倒的な存在感とリーダーシップの持ち主。" },
        { name: "自由なイルカ", icon: "🐬", desc: "知性に溢れ、周囲を明るくするムードメーカー。" },
        { name: "神秘の鳳凰", icon: "🐦‍🔥", desc: "困難を乗り越えるたびに強く美しく輝く運命。" },
        { name: "守護の白虎", icon: "🐅", desc: "勇気と行動力で道を切り開く開拓者。" },
        { name: "幸運のウサギ", icon: "🐰", desc: "鋭い直感と軽やかなステップでチャンスを掴む。" },
        { name: "賢者のフクロウ", icon: "🦉", desc: "冷静な判断力で真実を見極める知恵の象徴。" }
    ];

    function revealFortune() {
        const bday = document.getElementById('birthday').value;
        if(!bday) return;

        // 誕生日から数値を生成して動物を決定
        const dateNum = bday.replace(/-/g, "");
        const index = parseInt(dateNum) % animals.length;
        const animal = animals[index];

        // UI表示
        const resultDiv = document.getElementById('result');
        document.getElementById('animal-icon').textContent = animal.icon;
        document.getElementById('animal-name').textContent = animal.name;
        document.getElementById('animal-desc').textContent = animal.desc;
        resultDiv.style.opacity = 1;

        // 決定の瞬間にきらきら爆発
        for(let i=0; i<100; i++) {
            particles.push(new Particle(width/2, height/2, true));
        }
    }

    window.addEventListener('mousemove', (e) => {
        for (let i = 0; i < 2; i++) {
            particles.push(new Particle(e.clientX, e.clientY));
        }
    });

    function animate() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
        ctx.fillRect(0, 0, width, height);
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
